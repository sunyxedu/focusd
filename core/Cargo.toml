[package]
name = "hemlixfocus_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "hemlixfocus_core"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = { version = "0.32", features = ["cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
