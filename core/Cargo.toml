[package]
name = "focusd_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "focusd_core"
crate-type = ["lib", "cdylib"]

[features]
default = []
wasm = ["wasm-bindgen", "chrono/wasmbind", "getrandom/js"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
getrandom = { version = "0.2", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
