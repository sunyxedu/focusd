name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core (tests, clippy, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p hemlixfocus_core
      - run: cargo clippy -p hemlixfocus_core -- -D warnings
      - run: cargo install wasm-bindgen-cli --version "$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)"
      - run: ./scripts/build-wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: app/wasm

  web:
    name: Web app (typecheck, build)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: app/wasm
      - run: npm ci --prefix app
      - run: npm run typecheck --prefix app
      - run: npm run build --prefix app
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/dist

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,wasm32-unknown-unknown' || 'wasm32-unknown-unknown' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Linux webkit deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: app/wasm
      - run: npm ci --prefix app
      - run: cargo test -p focus-desktop
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.app.tar.gz
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.msi
            target/**/release/bundle/**/*.exe
          if-no-files-found: ignore

  pages:
    name: Deploy web build to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
