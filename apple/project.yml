name: HemlixFocus
options:
  bundleIdPrefix: app.hemlix
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  generateEmptyDirectories: true

packages: {}

targets:
  HemlixFocusCore:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/HemlixFocusCore
    dependencies:
      - framework: Frameworks/HemlixFocusCoreFFI.xcframework
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hemlix.HemlixFocusCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SWIFT_VERSION: "5.9"
        # The HemlixFocusCoreFFI C module comes from the xcframework's own
        # headers + module map (do not add import paths here — that would
        # redefine the module).
        # Local builds: ad-hoc / unsigned (no Apple Developer team needed)
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
  HemlixFocus:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources/HemlixFocus
    dependencies:
      - target: HemlixFocusCore
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hemlix.HemlixFocus
        PRODUCT_NAME: HemlixFocus
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HemlixFocus
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "5.9"
        ENABLE_MODULE_VERIFIER: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/Frameworks"
